# ============================================
# CI/CD Pipeline for GreenhouseAdmin
# Kotlin Multiplatform - WASM Web Application
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  DOCKER_IMAGE: apptolast/greenhouse-admin
  K8S_NAMESPACE_DEV: apptolast-greenhouse-admin-dev
  K8S_NAMESPACE_PROD: apptolast-greenhouse-admin-prod

jobs:
  # ============================================
  # Build and Test
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with API URL
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "API_BASE_URL=${{ secrets.API_BASE_URL_PROD }}" > local.properties
          else
            echo "API_BASE_URL=${{ secrets.API_BASE_URL_DEV }}" > local.properties
          fi
          echo "local.properties created with API_BASE_URL"

      - name: Build WASM Distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-distribution
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 1

  # ============================================
  # Docker Build and Push
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version
        id: version
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            VERSION="prod-$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          else
            VERSION="dev-$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Set API URL based on branch
        id: api_url
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "url=${{ secrets.API_BASE_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ secrets.API_BASE_URL_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            API_BASE_URL=${{ steps.api_url.outputs.url }}
